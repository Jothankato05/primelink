<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeLink Intelligence</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #0a0f1f; color: #fff; }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0a0f1f;
        }
        .login-box {
            width: 90%;
            max-width: 320px;
            padding: 40px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            text-align: center;
        }
        .login-box h1 {
            color: #00d4ff;
            font-size: 2.5em;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .login-box .subtitle {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 0.95em;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
        }

        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        .app-container.show {
            display: flex;
        }

        .header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid #00d4ff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 200;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title strong {
            color: #00d4ff;
            font-size: 1em;
            letter-spacing: 1px;
        }
        .header-title span {
            color: #999;
            font-size: 0.85em;
            letter-spacing: 2px;
        }
        .live-badge {
            background: #00ff64;
            color: #000;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.75em;
            font-weight: 700;
        }
        .back-btn, .logout-btn {
            padding: 6px 12px;
            background: transparent;
            color: #888;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .logout-btn { color: #f00; border-color: #f00; }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #map {
            flex: 1;
            position: relative;
        }

        .sidebar {
            width: 340px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 1px solid #00d4ff;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            margin-bottom: 20px;
        }
        .sidebar-label {
            color: #888;
            font-size: 0.75em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .sidebar-title {
            color: #fff;
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .sidebar-pop {
            color: #888;
            font-size: 0.85em;
        }

        .risk-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 16px;
            margin: 16px 0;
        }
        .risk-label {
            color: #888;
            font-size: 0.8em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .risk-score {
            font-size: 3em;
            font-weight: 700;
            color: #ffb347;
            line-height: 1;
        }
        .risk-badge {
            display: inline-block;
            background: rgba(255, 179, 71, 0.2);
            color: #ffb347;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.75em;
            font-weight: 600;
            margin-top: 8px;
        }

        .sectors-label {
            color: #888;
            font-size: 0.8em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 12px;
            display: block;
        }

        .sector-item {
            margin-bottom: 12px;
        }
        .sector-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.85em;
        }
        .sector-name {
            color: #888;
        }
        .sector-score {
            color: #00d4ff;
            font-weight: 600;
        }
        .sector-bar {
            background: rgba(0, 0, 0, 0.5);
            height: 6px;
            border-radius: 2px;
            overflow: hidden;
        }
        .sector-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff64);
        }

        .alerts-label {
            color: #888;
            font-size: 0.8em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 12px;
            display: block;
        }

        .alert-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #ffb347;
            border-radius: 2px;
            font-size: 0.8em;
            line-height: 1.4;
            color: #ddd;
        }
        .alert-item.good { border-left-color: #00ff64; }
        .alert-item.critical { border-left-color: #ff4444; }
        .alert-time {
            color: #666;
            font-size: 0.75em;
            margin-top: 4px;
        }

        .legend {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00d4ff;
            border-radius: 4px;
            padding: 12px;
            font-size: 0.8em;
            z-index: 100;
        }
        .legend-title {
            color: #888;
            font-size: 0.75em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            color: #ddd;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .stats-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 100;
        }
        .stat {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 3px;
            text-align: center;
            min-width: 70px;
            font-size: 0.75em;
        }
        .stat-value {
            color: #ffb347;
            font-weight: 700;
            font-size: 1.2em;
            line-height: 1;
        }
        .stat-label {
            color: #666;
            margin-top: 2px;
            font-size: 0.8em;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 2px;
        }

        .leaflet-control-attribution { background: transparent; color: #666; }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1>PrimeLink</h1>
            <p class="subtitle">INTELLIGENCE</p>
            <input type="text" id="username" placeholder="Username" class="login-input">
            <input type="password" id="password" placeholder="Password" class="login-input">
            <button onclick="login()" class="login-btn">Login</button>
            <p style="color: #666; font-size: 0.8em; margin-top: 15px;">Demo: demo / primelink</p>
        </div>
    </div>

    <div id="appScreen" class="app-container">
        <div class="header">
            <div class="header-title">
                <strong>◉ PrimeLink</strong>
                <span>INTELLIGENCE</span>
                <span class="live-badge">● LIVE</span>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="main">
            <div id="map"></div>

            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-label">Community</div>
                    <div class="sidebar-title" id="comName">Kano North</div>
                    <div class="sidebar-pop" id="comPop">45.2K residents</div>
                </div>

                <div class="risk-box">
                    <div class="risk-label">Community Risk Index</div>
                    <div class="risk-score" id="riskScore">68</div>
                    <span class="risk-badge" id="riskStatus">STABLE</span>
                </div>

                <label class="sectors-label">Sector Scores</label>
                <div id="sectorsContainer"></div>

                <label class="alerts-label">Alerts</label>
                <div id="alertsContainer"></div>
            </div>

            <div class="legend">
                <div class="legend-title">Risk Level</div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #00ff64;"></div>
                    <span>Stable (65-100)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #ffb347;"></div>
                    <span>Moderate (40-64)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #ff4444;"></div>
                    <span>Critical (0-39)</span>
                </div>
            </div>

            <div class="stats-bar" id="statsBar"></div>
        </div>
    </div>

    <script>
        const COMMUNITIES = [
            { id: 0, name: 'Kano North', state: 'Kano', pop: 285, lat: 12.0, lng: 8.5, climate: 65, ag: 60, fin: 55, health: 70, infra: 65 },
            { id: 1, name: 'Ibadan Central', state: 'Oyo', pop: 320, lat: 7.4, lng: 3.9, climate: 72, ag: 70, fin: 75, health: 78, infra: 75 },
            { id: 2, name: 'Maiduguri', state: 'Borno', pop: 215, lat: 11.8, lng: 13.2, climate: 45, ag: 40, fin: 50, health: 48, infra: 52 },
            { id: 3, name: 'Jos North', state: 'Plateau', pop: 180, lat: 9.9, lng: 8.9, climate: 68, ag: 65, fin: 62, health: 68, infra: 70 },
            { id: 4, name: 'Enugu East', state: 'Enugu', pop: 220, lat: 6.5, lng: 7.5, climate: 72, ag: 70, fin: 68, health: 72, infra: 70 },
            { id: 5, name: 'Sokoto Central', state: 'Sokoto', pop: 195, lat: 13.0, lng: 5.2, climate: 58, ag: 55, fin: 60, health: 62, infra: 58 },
            { id: 6, name: 'Port Harcourt', state: 'Rivers', pop: 280, lat: 4.8, lng: 7.0, climate: 70, ag: 68, fin: 70, health: 72, infra: 72 },
            { id: 7, name: 'Abuja Municipal', state: 'FCT', pop: 410, lat: 9.1, lng: 7.5, climate: 75, ag: 78, fin: 82, health: 82, infra: 80 }
        ];

        const ALERTS = [
            'Soil moisture declining in Kano North — 46% to 38% over 48 hours',
            'Parametric insurance payout processed — ₦1.2M disbursed to 47 farmers',
            'Clinic operating at 68% capacity — 8 facilities reporting',
            'Pest activity detected across 3 farm clusters',
            'Drought risk elevated — rainfall 40% below seasonal average',
            'Micro-credit scheme: 312 new farmers enrolled'
        ];

        let data = {};
        let selected = 0;
        let map = null;
        let markers = {};

        function getScore(c) {
            return Math.round([c.climate, c.ag, c.fin, c.health, c.infra].reduce((a,b) => a+b) / 5);
        }

        function getColor(s) {
            return s >= 65 ? '#00ff64' : s >= 40 ? '#ffb347' : '#ff4444';
        }

        function initMap() {
            map = L.map('map', { attributionControl: false }).setView([9.1, 7.5], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

            COMMUNITIES.forEach((c, i) => {
                const sc = getScore(data[i]);
                const marker = L.circleMarker([c.lat, c.lng], {
                    radius: 14,
                    fillColor: getColor(sc),
                    color: getColor(sc),
                    weight: 2,
                    opacity: 0.85,
                    fillOpacity: 0.75
                }).addTo(map);
                marker.on('click', () => selectCom(i));
                markers[i] = marker;
            });
        }

        function selectCom(i) {
            selected = i;
            render();
        }

        function render() {
            const c = COMMUNITIES[selected];
            const d = data[selected];
            const sc = getScore(d);

            document.getElementById('comName').textContent = c.name;
            document.getElementById('comPop').textContent = `${c.pop}K residents`;
            document.getElementById('riskScore').textContent = sc;
            document.getElementById('riskStatus').textContent = sc >= 65 ? 'STABLE' : sc >= 50 ? 'CAUTION' : 'CRITICAL';

            const sectors = [
                { name: 'HEALTH', emoji: '🏥', val: Math.round(d.health), color: '#00ff64' },
                { name: 'AGRICULTURE', emoji: '🌾', val: Math.round(d.ag), color: '#ffb347' },
                { name: 'ENVIRONMENT', emoji: '🌍', val: Math.round(d.climate), color: '#00ff64' },
                { name: 'FINANCE', emoji: '💰', val: Math.round(d.fin), color: '#ff6666' },
                { name: 'CLIMATE', emoji: '🌧️', val: Math.round(d.climate), color: '#00ff64' }
            ];

            document.getElementById('sectorsContainer').innerHTML = sectors.map(s => `
                <div class="sector-item">
                    <div class="sector-header">
                        <span class="sector-name">${s.emoji} ${s.name}</span>
                        <span class="sector-score">${s.val}</span>
                    </div>
                    <div class="sector-bar">
                        <div class="sector-fill" style="width: ${(s.val/95)*100}%; background: linear-gradient(90deg, ${s.color}, ${s.color}80);"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('alertsContainer').innerHTML = ALERTS.slice(0, 3).map((a, i) => `
                <div class="alert-item ${i % 3 === 2 ? 'good' : i % 2 === 0 ? 'critical' : ''}">
                    ${a}
                    <div class="alert-time">${Math.floor(Math.random()*12+1)}h ago</div>
                </div>
            `).join('');

            document.getElementById('statsBar').innerHTML = COMMUNITIES.map((c, i) => `
                <div class="stat">
                    <div class="stat-value">${getScore(data[i])}</div>
                    <div class="stat-label">${c.name.split(' ')[0]}</div>
                </div>
            `).join('');

            Object.entries(markers).forEach(([i, m]) => {
                m.setStyle({ fillColor: getColor(getScore(data[i])), color: getColor(getScore(data[i])) });
            });
        }

        function update() {
            COMMUNITIES.forEach((c, i) => {
                const d = data[i];
                d.climate += (Math.random() - 0.5) * 3;
                d.ag += (d.climate - c.climate) * 0.6 + (Math.random() - 0.5) * 2;
                d.fin += (d.ag - c.ag) * 0.5 + (Math.random() - 0.5) * 1.5;
                d.health += (d.fin - c.fin) * 0.4 + (Math.random() - 0.5) * 1.5;
                d.infra += (Math.random() - 0.5) * 0.5;
                ['climate', 'ag', 'fin', 'health', 'infra'].forEach(k => {
                    d[k] = Math.max(20, Math.min(95, d[k]));
                });
            });
            render();
        }

        function login() {
            if (document.getElementById('username').value === 'demo' && document.getElementById('password').value === 'primelink') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').classList.add('show');
                COMMUNITIES.forEach((c, i) => { data[i] = { ...c }; });
                initMap();
                render();
                setInterval(update, 2000);
            } else {
                alert('Invalid: demo / primelink');
            }
        }

        function logout() {
            document.getElementById('appScreen').classList.remove('show');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        document.getElementById('password').addEventListener('keypress', e => e.key === 'Enter' && login());
        window.addEventListener('load', () => document.getElementById('username').focus());
    </script>
</body>
</html>
