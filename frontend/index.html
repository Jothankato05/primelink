<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrimeLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1e;
            color: #fff;
            padding: 10px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 8px 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #00d4ff;
        }
        .header h1 {
            font-size: 1.2em;
            color: #00d4ff;
            margin: 0;
        }
        .header p {
            font-size: 0.7em;
            color: #888;
            margin: 2px 0 0 0;
        }

        .community-selector {
            margin-bottom: 12px;
        }
        .community-selector select {
            width: 100%;
            padding: 8px;
            background: #1a1a2e;
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .score-card {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid #00d4ff;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .composite-score {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .score-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #00d4ff;
        }
        .score-label {
            font-size: 0.75em;
            color: #aaa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.7em;
            font-weight: 600;
        }
        .status-excellent { background: rgba(0, 255, 100, 0.3); color: #00ff64; }
        .status-stable { background: rgba(0, 100, 200, 0.3); color: #00d4ff; }
        .status-warning { background: rgba(255, 165, 0, 0.3); color: #ffb347; }
        .status-critical { background: rgba(255, 0, 0, 0.3); color: #ff6666; }

        .sectors {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .sector {
            text-align: center;
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            font-size: 0.65em;
        }
        .sector-emoji {
            display: block;
            font-size: 1.2em;
            margin-bottom: 2px;
        }
        .sector-score {
            color: #00d4ff;
            font-weight: 600;
            display: block;
        }

        .alerts-section {
            margin-top: 15px;
        }
        .alerts-title {
            font-size: 0.85em;
            color: #00d4ff;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .alert-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            margin-bottom: 6px;
            border-left: 2px solid #ffb347;
            border-radius: 3px;
            font-size: 0.75em;
            line-height: 1.3;
        }
        .alert-critical { border-left-color: #ff4444; }
        .alert-good { border-left-color: #00ff64; }
        .alert-community {
            color: #00d4ff;
            font-weight: 600;
            display: block;
        }
        .alert-time {
            color: #888;
            font-size: 0.7em;
            margin-top: 2px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PrimeLink</h1>
        <p>Community Risk Intelligence</p>
    </div>

    <div class="community-selector">
        <select id="communitySelect">
            <option value="0">Kano North</option>
            <option value="1">Ibadan Central</option>
            <option value="2">Maiduguri</option>
            <option value="3">Jos North</option>
            <option value="4">Enugu East</option>
            <option value="5">Sokoto Central</option>
            <option value="6">Port Harcourt</option>
            <option value="7">Abuja Municipal</option>
        </select>
    </div>

    <div class="score-card">
        <div class="composite-score">
            <div>
                <div class="score-number" id="scoreNum">78</div>
                <div class="score-label">Community Risk Score</div>
            </div>
            <div>
                <span class="status-badge status-stable" id="statusBadge">STABLE</span>
            </div>
        </div>

        <div class="sectors" id="sectors"></div>
    </div>

    <div class="alerts-section">
        <div class="alerts-title">Live Alerts (7 events)</div>
        <div id="alertsList"></div>
    </div>

    <script>
        const BACKEND_URL = 'https://primelink-backend.onrender.com';

        const communities = [
            { name: 'Kano North', state: 'Kano', pop: 285000, base: 72 },
            { name: 'Ibadan Central', state: 'Oyo', pop: 320000, base: 78 },
            { name: 'Maiduguri', state: 'Borno', pop: 215000, base: 52 },
            { name: 'Jos North', state: 'Plateau', pop: 180000, base: 65 },
            { name: 'Enugu East', state: 'Enugu', pop: 220000, base: 70 },
            { name: 'Sokoto Central', state: 'Sokoto', pop: 195000, base: 60 },
            { name: 'Port Harcourt', state: 'Rivers', pop: 280000, base: 68 },
            { name: 'Abuja Municipal', state: 'FCT', pop: 410000, base: 82 }
        ];

        const sectors = [
            { emoji: '🏥', name: 'Health' },
            { emoji: '🌾', name: 'Agriculture' },
            { emoji: '💰', name: 'Finance' },
            { emoji: '🌧️', name: 'Climate' },
            { emoji: '🛣️', name: 'Infrastructure' }
        ];

        const sampleAlerts = [
            { community: 'Kano North', message: 'Soil moisture declining — 46% to 38% over 48h', type: 'warning', time: '12m ago' },
            { community: 'Ibadan Central', message: 'Parametric insurance payout — ₦1.2M disbursed to 47 farmers', type: 'good', time: '1h ago' },
            { community: 'Kano Central', message: 'Clinic operating at 68% capacity — 8 facilities reporting', type: 'warning', time: '2h ago' },
            { community: 'Ibadan Central', message: 'Pest activity detected across 3 farm clusters', type: 'warning', time: '3h ago' },
            { community: 'Sokoto Central', message: 'Drought risk elevated — rainfall 40% below seasonal avg', type: 'critical', time: '4h ago' },
            { community: 'Abuja Municipal', message: 'Micro-credit scheme: 312 new farmers enrolled', type: 'good', time: '5h ago' }
        ];

        function getSectorScore(base, idx, communityName) {
            const hash = (communityName + idx).charCodeAt(0);
            return Math.max(20, Math.min(95, base + ((hash % 20) - 10)));
        }

        function getStatusBadge(score) {
            if (score >= 75) return { text: 'EXCELLENT', class: 'status-excellent' };
            if (score >= 65) return { text: 'STABLE', class: 'status-stable' };
            if (score >= 50) return { text: 'CAUTION', class: 'status-warning' };
            return { text: 'CRITICAL', class: 'status-critical' };
        }

        function renderDashboard(idx) {
            const community = communities[idx];
            const score = Math.round(Math.max(0, Math.min(100, community.base + (Math.random() - 0.5) * 8)));
            const status = getStatusBadge(score);

            document.getElementById('scoreNum').textContent = score;
            document.getElementById('statusBadge').textContent = status.text;
            document.getElementById('statusBadge').className = 'status-badge ' + status.class;

            const sectorsHtml = sectors.map((s, i) => {
                const sScore = getSectorScore(community.base, i, community.name);
                return `<div class="sector"><span class="sector-emoji">${s.emoji}</span><span class="sector-score">${sScore}</span></div>`;
            }).join('');
            document.getElementById('sectors').innerHTML = sectorsHtml;

            const alertsHtml = sampleAlerts.slice(0, 6).map(a => {
                const alertClass = a.type === 'critical' ? 'alert-critical' : a.type === 'good' ? 'alert-good' : '';
                return `<div class="alert-item ${alertClass}"><span class="alert-community">${a.community}</span>${a.message}<span class="alert-time">${a.time}</span></div>`;
            }).join('');
            document.getElementById('alertsList').innerHTML = alertsHtml;
        }

        document.getElementById('communitySelect').addEventListener('change', (e) => {
            renderDashboard(parseInt(e.target.value));
        });

        renderDashboard(0);
        setInterval(() => renderDashboard(parseInt(document.getElementById('communitySelect').value)), 8000);
    </script>
</body>
</html>
