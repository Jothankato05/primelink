<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeLink Intelligence</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0f1f;
            color: #fff;
        }

        /* LOGIN SCREEN */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #0a0f1f;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .login-box {
            width: 300px;
            padding: 40px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 2.2em;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .login-box .subtitle {
            font-size: 0.85em;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .login-input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        /* APP SCREEN */
        #appScreen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        #appScreen.active {
            display: flex;
        }

        /* HEADER */
        .header {
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left strong {
            color: #00d4ff;
            font-size: 0.95em;
        }

        .header-left span {
            color: #999;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        .live-badge {
            background: #00ff64;
            color: #000;
            padding: 3px 6px;
            border-radius: 2px;
            font-size: 0.7em;
            font-weight: 700;
        }

        .logout-btn {
            padding: 5px 10px;
            background: transparent;
            color: #f00;
            border: 1px solid #f00;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8em;
        }

        /* MAIN CONTENT */
        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #map {
            flex: 1;
            background: #0a0f1f;
        }

        /* SIDEBAR */
        .sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.7);
            border-left: 1px solid #00d4ff;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .com-label {
            font-size: 0.75em;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .com-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .com-pop {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 20px;
        }

        /* RISK BOX */
        .risk-index {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .risk-label {
            font-size: 0.75em;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .risk-number {
            font-size: 2.8em;
            font-weight: 700;
            color: #ffb347;
            line-height: 1;
            margin-bottom: 8px;
        }

        .risk-status {
            display: inline-block;
            background: rgba(255, 179, 71, 0.2);
            color: #ffb347;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.75em;
            font-weight: 600;
        }

        /* SECTORS */
        .sectors-header {
            font-size: 0.75em;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .sector {
            margin-bottom: 12px;
        }

        .sector-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.85em;
        }

        .sector-name {
            color: #888;
        }

        .sector-val {
            color: #00d4ff;
            font-weight: 600;
        }

        .sector-bar {
            background: rgba(0, 0, 0, 0.5);
            height: 5px;
            border-radius: 2px;
            overflow: hidden;
        }

        .sector-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff64);
        }

        /* ALERTS */
        .alerts-header {
            font-size: 0.75em;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .alert {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #ffb347;
            border-radius: 2px;
            font-size: 0.8em;
            line-height: 1.3;
        }

        .alert.good {
            border-left-color: #00ff64;
        }

        .alert.critical {
            border-left-color: #ff4444;
        }

        .alert-time {
            color: #666;
            font-size: 0.75em;
            margin-top: 4px;
        }

        /* LEGEND */
        .legend {
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00d4ff;
            border-radius: 4px;
            padding: 12px;
            font-size: 0.8em;
            z-index: 100;
        }

        .legend-title {
            color: #888;
            font-size: 0.75em;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            color: #ccc;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* STATS BAR */
        .stats-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 100;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 3px;
            text-align: center;
            min-width: 75px;
            font-size: 0.75em;
        }

        .stat-value {
            color: #ffb347;
            font-weight: 700;
            font-size: 1.1em;
        }

        .stat-name {
            color: #666;
            font-size: 0.8em;
            margin-top: 2px;
        }

        /* SCROLLBAR */
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>PrimeLink</h1>
            <p class="subtitle">INTELLIGENCE</p>
            <input type="text" id="username" placeholder="Username" class="login-input">
            <input type="password" id="password" placeholder="Password" class="login-input">
            <button onclick="doLogin()" class="login-btn">Login</button>
            <p style="color: #666; font-size: 0.75em; margin-top: 15px;">Demo: demo / primelink</p>
        </div>
    </div>

    <!-- APP -->
    <div id="appScreen">
        <div class="header">
            <div class="header-left">
                <strong>◉ PrimeLink</strong>
                <span>INTELLIGENCE</span>
                <span class="live-badge">● LIVE</span>
            </div>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>

        <div class="content">
            <div id="map"></div>

            <div class="sidebar">
                <div class="com-label">Community</div>
                <div class="com-name" id="comName">Kano North</div>
                <div class="com-pop" id="comPop">285K residents</div>

                <div class="risk-index">
                    <div class="risk-label">Community Risk Index</div>
                    <div class="risk-number" id="risk">68</div>
                    <span class="risk-status" id="status">STABLE</span>
                </div>

                <div class="sectors-header">Sector Scores</div>
                <div id="sectors"></div>

                <div class="alerts-header">Alerts</div>
                <div id="alerts"></div>
            </div>

            <div class="legend">
                <div class="legend-title">Risk Level</div>
                <div class="legend-row">
                    <div class="legend-dot" style="background: #00ff64;"></div>
                    <span>Stable (65-100)</span>
                </div>
                <div class="legend-row">
                    <div class="legend-dot" style="background: #ffb347;"></div>
                    <span>Moderate (40-64)</span>
                </div>
                <div class="legend-row">
                    <div class="legend-dot" style="background: #ff4444;"></div>
                    <span>Critical (0-39)</span>
                </div>
            </div>

            <div class="stats-bottom" id="stats"></div>
        </div>
    </div>

    <script>
        const COMMUNITIES = [
            { name: 'Kano North', pop: 285, lat: 12.0, lng: 8.5, climate: 65, ag: 60, fin: 55, health: 70, infra: 65 },
            { name: 'Ibadan Central', pop: 320, lat: 7.4, lng: 3.9, climate: 72, ag: 70, fin: 75, health: 78, infra: 75 },
            { name: 'Maiduguri', pop: 215, lat: 11.8, lng: 13.2, climate: 45, ag: 40, fin: 50, health: 48, infra: 52 },
            { name: 'Jos North', pop: 180, lat: 9.9, lng: 8.9, climate: 68, ag: 65, fin: 62, health: 68, infra: 70 },
            { name: 'Enugu East', pop: 220, lat: 6.5, lng: 7.5, climate: 72, ag: 70, fin: 68, health: 72, infra: 70 },
            { name: 'Sokoto Central', pop: 195, lat: 13.0, lng: 5.2, climate: 58, ag: 55, fin: 60, health: 62, infra: 58 },
            { name: 'Port Harcourt', pop: 280, lat: 4.8, lng: 7.0, climate: 70, ag: 68, fin: 70, health: 72, infra: 72 },
            { name: 'Abuja Municipal', pop: 410, lat: 9.1, lng: 7.5, climate: 75, ag: 78, fin: 82, health: 82, infra: 80 }
        ];

        let data = {}, sel = 0, map = null, markers = {};

        function getScore(c) {
            return Math.round((c.climate + c.ag + c.fin + c.health + c.infra) / 5);
        }

        function getColor(s) {
            return s >= 65 ? '#00ff64' : s >= 40 ? '#ffb347' : '#ff4444';
        }

        function initMap() {
            map = L.map('map', { attributionControl: false }).setView([9.1, 7.5], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

            COMMUNITIES.forEach((c, i) => {
                const marker = L.circleMarker([c.lat, c.lng], {
                    radius: 13,
                    fillColor: getColor(getScore(data[i])),
                    color: getColor(getScore(data[i])),
                    weight: 2,
                    opacity: 0.8,
                    fillOpacity: 0.7
                }).addTo(map);
                marker.on('click', () => { sel = i; render(); });
                markers[i] = marker;
            });
        }

        function render() {
            const c = COMMUNITIES[sel];
            const d = data[sel];
            const sc = getScore(d);

            document.getElementById('comName').textContent = c.name;
            document.getElementById('comPop').textContent = `${c.pop}K residents`;
            document.getElementById('risk').textContent = sc;
            document.getElementById('status').textContent = sc >= 65 ? 'STABLE' : sc >= 50 ? 'CAUTION' : 'CRITICAL';

            const secs = [
                { emoji: '🏥', name: 'HEALTH', val: Math.round(d.health) },
                { emoji: '🌾', name: 'AGRICULTURE', val: Math.round(d.ag) },
                { emoji: '🌍', name: 'ENVIRONMENT', val: Math.round(d.climate) },
                { emoji: '💰', name: 'FINANCE', val: Math.round(d.fin) },
                { emoji: '🌧️', name: 'CLIMATE', val: Math.round(d.climate) }
            ];

            document.getElementById('sectors').innerHTML = secs.map(s => `
                <div class="sector">
                    <div class="sector-row">
                        <span class="sector-name">${s.emoji} ${s.name}</span>
                        <span class="sector-val">${s.val}</span>
                    </div>
                    <div class="sector-bar"><div class="sector-fill" style="width: ${s.val}%"></div></div>
                </div>
            `).join('');

            const alerts = [
                'Soil moisture declining in Kano North — 46% to 38% over 48h',
                'Parametric insurance payout processed — ₦1.2M disbursed',
                'Clinic operating at 68% capacity — 8 facilities reporting'
            ];

            document.getElementById('alerts').innerHTML = alerts.map((a, i) => `
                <div class="alert ${i === 1 ? 'good' : i === 2 ? '' : 'critical'}">
                    ${a}
                    <div class="alert-time">${i + 1}h ago</div>
                </div>
            `).join('');

            document.getElementById('stats').innerHTML = COMMUNITIES.map((c, i) => `
                <div class="stat-item">
                    <div class="stat-value">${getScore(data[i])}</div>
                    <div class="stat-name">${c.name.split(' ')[0]}</div>
                </div>
            `).join('');

            Object.entries(markers).forEach(([i, m]) => {
                const sc = getScore(data[i]);
                m.setStyle({ fillColor: getColor(sc), color: getColor(sc) });
            });
        }

        function update() {
            COMMUNITIES.forEach((c, i) => {
                const d = data[i];
                d.climate += (Math.random() - 0.5) * 3;
                d.ag += (d.climate - c.climate) * 0.6 + (Math.random() - 0.5) * 2;
                d.fin += (d.ag - c.ag) * 0.5 + (Math.random() - 0.5) * 1.5;
                d.health += (d.fin - c.fin) * 0.4 + (Math.random() - 0.5) * 1.5;
                d.infra += (Math.random() - 0.5) * 0.5;
                ['climate', 'ag', 'fin', 'health', 'infra'].forEach(k => {
                    d[k] = Math.max(20, Math.min(95, d[k]));
                });
            });
            render();
        }

        function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === 'demo' && p === 'primelink') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').classList.add('active');
                COMMUNITIES.forEach((c, i) => { data[i] = { ...c }; });
                setTimeout(() => initMap(), 100);
                render();
                setInterval(update, 2000);
            } else {
                alert('Invalid: demo / primelink');
            }
        }

        function doLogout() {
            document.getElementById('appScreen').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        document.getElementById('password').addEventListener('keypress', e => e.key === 'Enter' && doLogin());
        window.addEventListener('load', () => document.getElementById('username').focus());
    </script>
</body>
</html>
