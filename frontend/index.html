<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0 20px; border-bottom: 2px solid #00d4ff; }
        h1 { font-size: 2.5em; color: #00d4ff; margin-bottom: 10px; }
        .subtitle { font-size: 1.1em; color: #aaa; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 { color: #00d4ff; margin-bottom: 15px; font-size: 1.3em; }
        .score-display {
            font-size: 3em;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
        }
        .score-critical { background: rgba(255, 0, 0, 0.2); color: #ff4444; }
        .score-warning { background: rgba(255, 165, 0, 0.2); color: #ffb347; }
        .score-good { background: rgba(0, 255, 100, 0.2); color: #00ff64; }
        .population { color: #aaa; font-size: 0.9em; margin-top: 10px; }
        .status { margin-top: 10px; padding: 10px; border-radius: 4px; font-weight: 600; }
        .status-critical { background: rgba(255, 0, 0, 0.3); color: #ff6666; }
        .status-warning { background: rgba(255, 165, 0, 0.3); color: #ffb366; }
        .status-good { background: rgba(0, 255, 100, 0.3); color: #66ff99; }
        .alerts { margin-top: 40px; padding: 20px; background: rgba(0, 212, 255, 0.05); border: 2px solid #00d4ff; border-radius: 8px; }
        .alerts h2 { color: #00d4ff; margin-bottom: 15px; }
        .alert { background: rgba(0, 0, 0, 0.3); padding: 10px; margin: 8px 0; border-radius: 4px; border-left: 3px solid #ffb347; }
        .alert-critical { border-left-color: #ff4444; }
        .alert-info { border-left-color: #00d4ff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PrimeLink</h1>
            <p class="subtitle">Community Risk Intelligence</p>
            <p style="color: #888;">Predicting failures 2-3 weeks in advance</p>
        </header>
        <div id="grid" class="grid"></div>
        <div class="alerts" id="alerts" style="display:none;">
            <h2>Recent Alerts</h2>
            <div id="alertList"></div>
        </div>
    </div>
    <script>
        const BACKEND_URL = 'https://primelink-backend.onrender.com';
        
        const data = [
            { name: 'Kano North', state: 'Kano', pop: 285000, base: 72 },
            { name: 'Ibadan Central', state: 'Oyo', pop: 320000, base: 78 },
            { name: 'Maiduguri', state: 'Borno', pop: 215000, base: 52 },
            { name: 'Jos North', state: 'Plateau', pop: 180000, base: 65 },
            { name: 'Enugu East', state: 'Enugu', pop: 220000, base: 70 },
            { name: 'Sokoto Central', state: 'Sokoto', pop: 195000, base: 60 },
            { name: 'Port Harcourt', state: 'Rivers', pop: 280000, base: 68 },
            { name: 'Abuja Municipal', state: 'FCT', pop: 410000, base: 82 }
        ];
        
        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            data.forEach(c => {
                const score = Math.round(Math.max(0, Math.min(100, c.base + (Math.random() - 0.5) * 8)));
                let cls = score >= 65 ? 'score-good' : score >= 40 ? 'score-warning' : 'score-critical';
                let stat = score >= 75 ? 'Excellent' : score >= 65 ? 'Stable' : score >= 50 ? 'Some concerns' : score >= 35 ? 'Under stress' : 'Critical';
                let scls = score >= 65 ? 'status-good' : score >= 40 ? 'status-warning' : 'status-critical';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${c.name}</h3><div class="score-display ${cls}">${score}/100</div><div class="population">${c.pop.toLocaleString()} (${c.state})</div><div class="status ${scls}">${stat}</div>`;
                grid.appendChild(card);
            });
        }
        
        async function loadAlerts() {
            try {
                const res = await fetch(BACKEND_URL + '/api/alerts?limit=5');
                if (res.ok) {
                    const alerts = await res.json();
                    const alertList = document.getElementById('alertList');
                    alertList.innerHTML = '';
                    alerts.forEach(a => {
                        const div = document.createElement('div');
                        div.className = 'alert ' + (a.type === 'CRITICAL' ? 'alert-critical' : 'alert-info');
                        div.innerHTML = `<strong>${a.community}</strong> - ${a.message}`;
                        alertList.appendChild(div);
                    });
                    document.getElementById('alerts').style.display = 'block';
                }
            } catch(e) {
                console.log('Backend offline - showing local data');
            }
        }
        
        render();
        loadAlerts();
        setInterval(render, 5000);
        setInterval(loadAlerts, 10000);
    </script>
</body>
</html>
