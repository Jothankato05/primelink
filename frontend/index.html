<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PrimeLink Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #00d4ff;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.1em;
            color: #00d4ff;
            margin: 0;
        }
        .header p {
            font-size: 0.65em;
            color: #888;
            margin: 2px 0 0 0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .community-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }
        .community-btn {
            padding: 8px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            border-radius: 4px;
            font-size: 0.7em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .community-btn.active {
            background: #00d4ff;
            color: #0f0f1e;
            font-weight: 700;
        }
        .community-btn:active {
            opacity: 0.8;
        }

        .dashboard {
            display: grid;
            gap: 10px;
        }

        .score-card {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid #00d4ff;
            border-radius: 6px;
            padding: 10px;
        }
        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .score-number {
            font-size: 2.2em;
            font-weight: bold;
            color: #00d4ff;
        }
        .status-badge {
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 0.65em;
            font-weight: 600;
        }
        .status-excellent { background: rgba(0, 255, 100, 0.3); color: #00ff64; }
        .status-stable { background: rgba(0, 100, 200, 0.3); color: #00d4ff; }
        .status-warning { background: rgba(255, 165, 0, 0.3); color: #ffb347; }
        .status-critical { background: rgba(255, 0, 0, 0.3); color: #ff6666; }

        .sectors {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .sector {
            text-align: center;
            padding: 6px 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            font-size: 0.6em;
        }
        .sector-emoji {
            display: block;
            font-size: 1.1em;
            margin-bottom: 2px;
        }
        .sector-score {
            color: #00d4ff;
            font-weight: 600;
            display: block;
        }
        .sector-label {
            display: block;
            color: #888;
            font-size: 0.8em;
            margin-top: 2px;
        }

        .alerts {
            margin-top: 5px;
        }
        .alerts-title {
            font-size: 0.7em;
            color: #00d4ff;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .alert-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            margin-bottom: 4px;
            border-left: 2px solid #ffb347;
            border-radius: 3px;
            font-size: 0.65em;
            line-height: 1.2;
        }
        .alert-critical { border-left-color: #ff4444; }
        .alert-good { border-left-color: #00ff64; }
        .alert-message {
            color: #ddd;
            display: block;
        }
        .alert-time {
            color: #888;
            font-size: 0.8em;
            margin-top: 2px;
            display: block;
        }

        .info-bar {
            font-size: 0.65em;
            color: #888;
            text-align: center;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            margin-top: 5px;
        }

        /* Scrollbar */
        .content::-webkit-scrollbar {
            width: 4px;
        }
        .content::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.05);
        }
        .content::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 2px;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
        }
        .login-box {
            width: 90%;
            max-width: 300px;
            padding: 30px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            text-align: center;
        }
        .login-input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .login-input::placeholder {
            color: #666;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #00d4ff;
            color: #0f0f1e;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h1 style="color: #00d4ff; font-size: 1.8em; margin-bottom: 10px;">PrimeLink</h1>
            <p style="color: #888; font-size: 0.8em; margin-bottom: 20px;">Community Risk Intelligence</p>

            <input type="text" id="username" placeholder="Username" class="login-input">
            <input type="password" id="password" placeholder="Password" class="login-input">

            <button onclick="login()" class="login-btn">Login</button>
            <p style="color: #888; font-size: 0.7em; margin-top: 15px; text-align: center;">Demo: username • password</p>
        </div>
    </div>

    <div id="appScreen" style="display: none; height: 100%; display: flex; flex-direction: column;">
        <div class="header">
            <h1>PrimeLink</h1>
            <p>Offline Simulation - No Backend</p>
        </div>

        <div class="content">
            <div class="community-selector" id="communityButtons"></div>
            <div class="dashboard" id="dashboard"></div>
            <div class="info-bar">
                ⚡ Live simulation • Updates every 2 seconds • 100% Offline
            </div>
        </div>
    </div>

    <script>
        // ============ LOGIN ============
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'demo' && password === 'primelink') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                startApp();
            } else {
                alert('Invalid credentials\n\nUse:\nUsername: demo\nPassword: primelink');
            }
        }

        // Allow Enter key to login
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') login();
                });
            }
        });

        // ============ DATA ============
        const COMMUNITIES = [
            { name: 'Kano North', state: 'Kano', pop: 285000, climate: 65, ag: 60, fin: 55, health: 70, infra: 65 },
            { name: 'Ibadan Central', state: 'Oyo', pop: 320000, climate: 72, ag: 70, fin: 75, health: 78, infra: 75 },
            { name: 'Maiduguri', state: 'Borno', pop: 215000, climate: 45, ag: 40, fin: 50, health: 48, infra: 52 },
            { name: 'Jos North', state: 'Plateau', pop: 180000, climate: 68, ag: 65, fin: 62, health: 68, infra: 70 },
            { name: 'Enugu East', state: 'Enugu', pop: 220000, climate: 72, ag: 70, fin: 68, health: 72, infra: 70 },
            { name: 'Sokoto Central', state: 'Sokoto', pop: 195000, climate: 58, ag: 55, fin: 60, health: 62, infra: 58 },
            { name: 'Port Harcourt', state: 'Rivers', pop: 280000, climate: 70, ag: 68, fin: 70, health: 72, infra: 72 },
            { name: 'Abuja Municipal', state: 'FCT', pop: 410000, climate: 75, ag: 78, fin: 82, health: 82, infra: 80 }
        ];

        const SECTORS = [
            { key: 'climate', emoji: '🌧️', label: 'Climate' },
            { key: 'ag', emoji: '🌾', label: 'Agriculture' },
            { key: 'fin', emoji: '💰', label: 'Finance' },
            { key: 'health', emoji: '🏥', label: 'Health' },
            { key: 'infra', emoji: '🛣️', label: 'Infrastructure' }
        ];

        const ALERT_TEMPLATES = [
            { msg: 'Rainfall {pct}% below seasonal average', type: 'warning' },
            { msg: 'Soil moisture declining rapidly', type: 'warning' },
            { msg: 'Crop yield down {pct}%', type: 'warning' },
            { msg: '{n} farmers enrolled in micro-credit', type: 'good' },
            { msg: 'Clinic operating at {pct}% capacity', type: 'warning' },
            { msg: 'Market prices stabilizing', type: 'good' },
            { msg: 'Parametric insurance payout processed', type: 'good' },
            { msg: 'Water shortage risk elevated', type: 'critical' },
            { msg: 'Health workers shortage reported', type: 'critical' },
            { msg: 'Road infrastructure improved {pct}%', type: 'good' }
        ];

        // ============ STATE ============
        let currentCommunity = 0;
        let communityData = {};
        let alerts = [];
        let time = 0;

        // ============ CASCADE ENGINE ============
        function calculateCascade(base) {
            // Climate affects agriculture with delay
            const climate = base.climate + (Math.random() - 0.5) * 6;
            const ag = base.ag + (climate - base.climate) * 0.6 + (Math.random() - 0.5) * 4;

            // Agriculture affects finance
            const fin = base.fin + (ag - base.ag) * 0.5 + (Math.random() - 0.5) * 3;

            // Finance affects health
            const health = base.health + (fin - base.fin) * 0.4 + (Math.random() - 0.5) * 3;

            // Infrastructure affects all (slowly)
            const infra = base.infra + (Math.random() - 0.5) * 2;

            return {
                climate: Math.max(20, Math.min(95, climate)),
                ag: Math.max(20, Math.min(95, ag)),
                fin: Math.max(20, Math.min(95, fin)),
                health: Math.max(20, Math.min(95, health)),
                infra: Math.max(20, Math.min(95, infra))
            };
        }

        function getCompositeScore(sectors) {
            const scores = Object.values(sectors);
            return Math.round(scores.reduce((a, b) => a + b) / scores.length);
        }

        function getStatus(score) {
            if (score >= 75) return { text: 'EXCELLENT', class: 'status-excellent' };
            if (score >= 65) return { text: 'STABLE', class: 'status-stable' };
            if (score >= 50) return { text: 'CAUTION', class: 'status-warning' };
            return { text: 'CRITICAL', class: 'status-critical' };
        }

        // ============ ALERT GENERATION ============
        function generateAlerts(community, sectors, score) {
            const newAlerts = [];
            const alertChance = score < 60 ? 0.4 : score < 70 ? 0.2 : 0.08;

            if (Math.random() < alertChance) {
                const template = ALERT_TEMPLATES[Math.floor(Math.random() * ALERT_TEMPLATES.length)];
                let msg = template.msg;
                msg = msg.replace('{pct}', Math.floor(Math.random() * 40 + 10));
                msg = msg.replace('{n}', Math.floor(Math.random() * 500 + 50));

                newAlerts.push({
                    community: community.name,
                    message: msg,
                    type: template.type,
                    time: 'now'
                });
            }

            // Age existing alerts
            alerts = alerts.map(a => {
                const timeStr = a.time === 'now' ? '1m ago' : a.time === '1m ago' ? '5m ago' : a.time;
                return { ...a, time: timeStr };
            }).slice(0, 5);

            alerts = [...newAlerts, ...alerts].slice(0, 6);
        }

        // ============ INIT ============
        function initCommunityData() {
            communityData = {};
            COMMUNITIES.forEach((c, idx) => {
                communityData[idx] = {
                    base: { climate: c.climate, ag: c.ag, fin: c.fin, health: c.health, infra: c.infra },
                    current: { ...c }
                };
            });
        }

        function renderButtons() {
            const html = COMMUNITIES.map((c, idx) =>
                `<button class="community-btn ${idx === currentCommunity ? 'active' : ''}" onclick="selectCommunity(${idx})">${c.name.split(' ')[0]}</button>`
            ).join('');
            document.getElementById('communityButtons').innerHTML = html;
        }

        function renderDashboard() {
            const c = COMMUNITIES[currentCommunity];
            const data = communityData[currentCommunity];
            const score = getCompositeScore(data.current);
            const status = getStatus(score);

            let html = `
                <div class="score-card">
                    <div class="score-header">
                        <div class="score-number">${score}</div>
                        <span class="status-badge ${status.class}">${status.text}</span>
                    </div>
                    <div class="sectors">
            `;

            SECTORS.forEach(s => {
                const val = Math.round(data.current[s.key]);
                html += `
                    <div class="sector">
                        <span class="sector-emoji">${s.emoji}</span>
                        <span class="sector-score">${val}</span>
                        <span class="sector-label">${s.label}</span>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
                <div class="alerts">
                    <div class="alerts-title">Live Events</div>
            `;

            alerts.forEach(a => {
                const cls = a.type === 'critical' ? 'alert-critical' : a.type === 'good' ? 'alert-good' : '';
                html += `
                    <div class="alert-item ${cls}">
                        <span class="alert-message">${a.message}</span>
                        <span class="alert-time">${a.time}</span>
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('dashboard').innerHTML = html;
        }

        function selectCommunity(idx) {
            currentCommunity = idx;
            renderButtons();
            renderDashboard();
        }

        // ============ UPDATE LOOP ============
        function update() {
            time++;

            // Update all communities
            for (let idx = 0; idx < COMMUNITIES.length; idx++) {
                const data = communityData[idx];
                data.current = calculateCascade(data.base);

                // Update base slightly (drift)
                data.base.climate += (Math.random() - 0.5) * 0.5;
                data.base.ag += (Math.random() - 0.5) * 0.3;
                data.base.fin += (Math.random() - 0.5) * 0.2;
                data.base.health += (Math.random() - 0.5) * 0.3;
                data.base.infra += (Math.random() - 0.5) * 0.1;

                // Clamp bases
                Object.keys(data.base).forEach(k => {
                    data.base[k] = Math.max(20, Math.min(95, data.base[k]));
                });
            }

            // Generate alerts for current community
            const c = COMMUNITIES[currentCommunity];
            const data = communityData[currentCommunity];
            const score = getCompositeScore(data.current);
            generateAlerts(c, data.current, score);

            // Render
            renderDashboard();
        }

        // ============ START ============
        function startApp() {
            initCommunityData();
            renderButtons();
            renderDashboard();
            setInterval(update, 2000);
        }

        // Auto-focus username on load
        window.addEventListener('load', () => {
            document.getElementById('username').focus();
        });
    </script>
</body>
</html>
