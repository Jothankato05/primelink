services:
  # ── PrimeLink Backend (Node.js / Express + Socket.io) ─────────────────────
  - type: web
    name: primelink-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://primelink-frontend.onrender.com

  # ── PrimeLink Frontend (React + Vite static site) ─────────────────────────
  - type: web
    name: primelink-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://primelink-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
