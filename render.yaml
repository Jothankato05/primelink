services:
  - type: web
    name: primelink-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: FRONTEND_URL
        value: https://primelink-frontend.onrender.com
      - key: NODE_ENV
        value: production
    plan: free
    region: oregon

  - type: static_site
    name: primelink-frontend
    buildCommand: echo "PWA Mobile Dashboard - $(date)" && cp ./frontend/* ./frontend/ 2>/dev/null || true
    staticPublishPath: ./frontend
    routes:
      - path: /
        destination: /index.html
      - path: /*
        destination: /index.html
    plan: free
    region: oregon
    headers:
      - path: /index.html
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
