services:
  - type: web
    name: primelink-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: FRONTEND_URL
        value: https://primelink-frontend.onrender.com
      - key: NODE_ENV
        value: production
    plan: free
    region: oregon

  - type: static_site
    name: primelink-frontend
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: ./frontend
    routes:
      - path: /
        destination: /index.html
    plan: free
    region: oregon
